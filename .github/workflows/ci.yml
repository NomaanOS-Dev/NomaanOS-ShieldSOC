name: ShieldSOC CI
​on:
push:
pull_request:
​permissions:
contents: read
​jobs:
test:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
- uses: actions/setup-python@v5
with:
python-version: "3.11"
- run: python -m py_compile shield_monitor.py
- run: python shield_monitor.py
- run: git diff --check
